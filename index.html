<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模架工装智能管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#2563eb', hover: '#1d4ed8', light: '#dbeafe' },
            sidebar: { bg: '#1e293b', text: '#cbd5e1', active: '#334155', hover: '#334155' },
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    .fade-in { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .dialog-overlay { background: rgba(0,0,0,0.5); }
    .menu-arrow { transition: transform 0.2s; display: inline-block; width: 16px; text-align: center; }
    .menu-arrow.open { transform: rotate(90deg); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div id="app"></div>

<script>
// ==================== 全局状态 ====================
window.store = {
  currentHash: '',
  menuExpanded: { 'basic': true, 'asset-warehouse': false, 'order': false, 'design': false, 'asset': false, 'settlement': false, 'stats': false },
  dialogs: {}
};

// ==================== 路由 ====================
window.router = {
  routes: {
    'home': 'home',
    'warehouse': 'warehouse',
    'product-category': 'productCategory',
    'product-management': 'productManagement',
    'bom': 'bom',
    'amortization': 'amortization',
    'rental': 'rental',
    'map': 'map',
    'management': 'management',
    'rental-order': 'rentalOrder',
    'transfer-order': 'transferOrder',
    'purchase-order': 'purchaseOrder',
    'archive': 'archive',
    'outbound': 'outbound',
    'inbound': 'inbound',
    'inventory-check': 'inventoryCheck',
    'maintenance': 'maintenance',
    'disposal': 'disposal',
    'refurbishment': 'refurbishment',
    'internal-settlement': 'internalSettlement',
    'external-settlement': 'externalSettlement',
    'inventory-analysis': 'inventoryAnalysis',
    'other-analysis': 'otherAnalysis',
    'config': 'config',
    'config/system': 'configSystem',
    'config/version': 'configVersion',
    'config/menu': 'configMenu',
    'config/page': 'configPage',
    'config/role': 'configRole'
  },
  navigate: function(hash) {
    window.location.hash = hash;
  },
  getCurrentPage: function() {
    var h = window.location.hash.replace('#', '') || 'home';
    return this.routes[h] || 'home';
  }
};

// ==================== 组件 ====================
window.Components = {};

window.Components.Button = function(opts) {
  var cls = 'inline-flex items-center justify-center px-4 py-2 rounded-md text-sm font-medium transition-colors cursor-pointer ';
  if (opts.variant === 'primary') cls += 'bg-primary text-white hover:bg-primary-hover';
  else if (opts.variant === 'outline') cls += 'border border-gray-300 bg-white text-gray-700 hover:bg-gray-50';
  else if (opts.variant === 'danger') cls += 'bg-red-500 text-white hover:bg-red-600';
  else if (opts.variant === 'ghost') cls += 'text-gray-600 hover:bg-gray-100';
  else cls += 'bg-primary text-white hover:bg-primary-hover';
  if (opts.size === 'sm') cls += ' px-3 py-1 text-xs';
  if (opts.className) cls += ' ' + opts.className;
  var onclick = opts.onclick ? ' onclick="' + opts.onclick + '"' : '';
  return '<button class="' + cls + '"' + onclick + '>' + (opts.icon || '') + ' ' + opts.text + '</button>';
};

window.Components.Card = function(opts) {
  var cls = 'bg-white rounded-lg shadow-sm border border-gray-200 p-6';
  if (opts.className) cls += ' ' + opts.className;
  return '<div class="' + cls + '">' + opts.content + '</div>';
};

window.Components.StatCard = function(opts) {
  var colors = ['blue', 'green', 'orange', 'purple', 'red', 'teal', 'indigo', 'pink'];
  var c = colors[opts.colorIndex % colors.length];
  var bgMap = { blue: 'bg-blue-50', green: 'bg-green-50', orange: 'bg-orange-50', purple: 'bg-purple-50', red: 'bg-red-50', teal: 'bg-teal-50', indigo: 'bg-indigo-50', pink: 'bg-pink-50' };
  var iconBgMap = { blue: 'bg-blue-100 text-blue-600', green: 'bg-green-100 text-green-600', orange: 'bg-orange-100 text-orange-600', purple: 'bg-purple-100 text-purple-600', red: 'bg-red-100 text-red-600', teal: 'bg-teal-100 text-teal-600', indigo: 'bg-indigo-100 text-indigo-600', pink: 'bg-pink-100 text-pink-600' };
  return '<div class="' + (bgMap[c] || 'bg-blue-50') + ' rounded-lg p-6 border border-gray-100">' +
    '<div class="flex items-center justify-between">' +
      '<div><p class="text-sm text-gray-500">' + opts.label + '</p><p class="text-2xl font-bold text-gray-800 mt-1">' + opts.value + '</p></div>' +
      '<div class="w-12 h-12 rounded-full ' + (iconBgMap[c] || '') + ' flex items-center justify-center text-xl">' + opts.icon + '</div>' +
    '</div>' +
    (opts.trend ? '<p class="text-xs text-gray-400 mt-2">' + opts.trend + '</p>' : '') +
  '</div>';
};

window.Components.Table = function(opts) {
  var html = '<div class="overflow-x-auto"><table class="w-full text-sm">';
  html += '<thead><tr class="bg-gray-50 border-b border-gray-200">';
  for (var i = 0; i < opts.columns.length; i++) {
    html += '<th class="px-4 py-3 text-left font-medium text-gray-600">' + opts.columns[i] + '</th>';
  }
  html += '<th class="px-4 py-3 text-center font-medium text-gray-600">操作</th>';
  html += '</tr></thead><tbody>';
  for (var r = 0; r < opts.rows.length; r++) {
    html += '<tr class="border-b border-gray-100 hover:bg-gray-50">';
    for (var c = 0; c < opts.rows[r].length; c++) {
      html += '<td class="px-4 py-3">' + opts.rows[r][c] + '</td>';
    }
    html += '<td class="px-4 py-3 text-center"><button class="text-primary hover:underline text-xs" onclick="window.showDialog(\'' + (opts.dialogId || 'default') + '\')">编辑</button> <button class="text-red-500 hover:underline text-xs">删除</button></td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
};

window.Components.Input = function(opts) {
  return '<input type="' + (opts.type || 'text') + '" placeholder="' + (opts.placeholder || '') + '" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent ' + (opts.className || '') + '" />';
};

window.Components.Select = function(opts) {
  var html = '<select class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary ' + (opts.className || '') + '">';
  for (var i = 0; i < opts.options.length; i++) {
    html += '<option>' + opts.options[i] + '</option>';
  }
  html += '</select>';
  return html;
};

window.Components.Dialog = function(opts) {
  return '<div id="dialog-' + opts.id + '" class="hidden fixed inset-0 z-50 flex items-center justify-center dialog-overlay">' +
    '<div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4 fade-in">' +
      '<div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">' +
        '<h3 class="text-lg font-semibold">' + opts.title + '</h3>' +
        '<button onclick="window.hideDialog(\'' + opts.id + '\')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>' +
      '</div>' +
      '<div class="px-6 py-4">' + opts.content + '</div>' +
      '<div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">' +
        '<button onclick="window.hideDialog(\'' + opts.id + '\')" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50">取消</button>' +
        '<button onclick="window.hideDialog(\'' + opts.id + '\')" class="px-4 py-2 bg-primary text-white rounded-md text-sm hover:bg-primary-hover">确认</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};

window.Components.Badge = function(opts) {
  var cls = 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ';
  if (opts.color === 'green') cls += 'bg-green-100 text-green-700';
  else if (opts.color === 'red') cls += 'bg-red-100 text-red-700';
  else if (opts.color === 'yellow') cls += 'bg-yellow-100 text-yellow-700';
  else if (opts.color === 'blue') cls += 'bg-blue-100 text-blue-700';
  else if (opts.color === 'gray') cls += 'bg-gray-100 text-gray-700';
  else cls += 'bg-blue-100 text-blue-700';
  return '<span class="' + cls + '">' + opts.text + '</span>';
};

window.Components.Switch = function(opts) {
  var checked = opts.checked ? 'checked' : '';
  return '<label class="relative inline-flex items-center cursor-pointer">' +
    '<input type="checkbox" class="sr-only peer" ' + checked + ' />' +
    '<div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[\'\'] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>' +
  '</label>';
};

// ==================== 弹窗控制 ====================
window.showDialog = function(id) {
  var el = document.getElementById('dialog-' + id);
  if (el) el.classList.remove('hidden');
};
window.hideDialog = function(id) {
  var el = document.getElementById('dialog-' + id);
  if (el) el.classList.add('hidden');
};

// ==================== 菜单折叠 ====================
window.toggleMenu = function(group) {
  window.store.menuExpanded[group] = !window.store.menuExpanded[group];
  window.render();
};

// ==================== 页面辅助函数 ====================
function pageWrapper(title, breadcrumbs, statsHtml, filterHtml, tableHtml, dialogId, dialogTitle, dialogFields) {
  var html = '<div class="fade-in">';
  html += '<div class="mb-6"><h1 class="text-2xl font-bold text-gray-800">' + title + '</h1>';
  html += '<p class="text-sm text-gray-500 mt-1">' + breadcrumbs + '</p></div>';
  html += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">' + statsHtml + '</div>';
  html += '<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">';
  html += '<div class="flex flex-wrap items-center justify-between gap-4 mb-4">';
  html += '<div class="flex flex-wrap items-center gap-3">' + filterHtml + '</div>';
  html += '<div class="flex items-center gap-2">';
  html += window.Components.Button({ text: '新增', variant: 'primary', icon: '+', onclick: "window.showDialog('" + dialogId + "')" });
  html += window.Components.Button({ text: '导出', variant: 'outline', icon: '&#x2193;' });
  html += '</div></div>';
  html += tableHtml;
  html += '</div></div>';
  return html;
}

function formField(label, type) {
  if (type === 'select') {
    return '<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">' + label + '</label>' +
      '<select class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"><option>请选择</option></select></div>';
  }
  if (type === 'textarea') {
    return '<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">' + label + '</label>' +
      '<textarea class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" rows="3"></textarea></div>';
  }
  return '<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">' + label + '</label>' +
    '<input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请输入' + label + '" /></div>';
}

function renderMenu() {
  var currentHash = window.location.hash.replace('#', '') || 'home';
  var html = '';
  html += '<div class="px-4 py-5 border-b border-gray-700">';
  html += '<div class="flex items-center gap-3 cursor-pointer" onclick="window.router.navigate(\'home\')">';
  html += '<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-sm">M</div>';
  html += '<div><h2 class="text-sm font-semibold text-white">模架工装</h2><p class="text-xs text-gray-400">智能管理系统</p></div>';
  html += '</div></div>';
  html += '<nav class="mt-2 px-2 sidebar-scroll" style="max-height:calc(100vh - 180px);overflow-y:auto">';
  for (var i = 0; i < menuConfig.length; i++) {
    var group = menuConfig[i];
    var expanded = window.store.menuExpanded[group.group];
    var hasActive = false;
    for (var k = 0; k < group.items.length; k++) {
      if (group.items[k].hash === currentHash) hasActive = true;
    }
    html += '<div class="mb-1">';
    html += '<div class="flex items-center justify-between px-3 py-2 rounded-md cursor-pointer text-sm ' + (hasActive ? 'bg-sidebar-active text-white' : 'text-sidebar-text hover:bg-sidebar-hover') + '" onclick="window.toggleMenu(\'' + group.group + '\')">';
    html += '<div class="flex items-center gap-2"><span>' + group.icon + '</span><span>' + group.label + '</span></div>';
    html += '<span class="menu-arrow ' + (expanded ? 'open' : '') + '">' + (expanded ? '&#x25BC;' : '&#x25B6;') + '</span>';
    html += '</div>';
    if (expanded) {
      for (var j = 0; j < group.items.length; j++) {
        var item = group.items[j];
        var isActive = item.hash === currentHash;
        html += '<div class="pl-9 pr-3 py-1.5 rounded-md cursor-pointer text-sm ml-2 ' + (isActive ? 'bg-primary text-white' : 'text-sidebar-text hover:bg-sidebar-hover') + '" onclick="window.router.navigate(\'' + item.hash + '\')">';
        html += item.label + '</div>';
      }
    }
    html += '</div>';
  }
  html += '<div class="mt-4 pt-4 border-t border-gray-700">';
  html += '<div class="px-3 py-2 rounded-md cursor-pointer text-sm ' + (currentHash === 'config' || currentHash.startsWith('config/') ? 'bg-sidebar-active text-white' : 'text-sidebar-text hover:bg-sidebar-hover') + '" onclick="window.router.navigate(\'config\')">';
  html += '<div class="flex items-center gap-2"><span>&#x2699;</span><span>配置中心</span></div></div>';
  html += '</div></nav>';
  return html;
}

// ==================== 主渲染函数 ====================
window.render = function() {
  var currentHash = window.location.hash.replace('#', '') || 'home';
  var pageName = window.router.getCurrentPage();
  var pageContent = '';
  if (window.Pages[pageName]) {
    pageContent = window.Pages[pageName]();
  } else {
    pageContent = '<div class="text-center py-20"><h2 class="text-xl text-gray-500">页面开发中...</h2></div>';
  }

  var isHome = (currentHash === '' || currentHash === 'home');
  var html = '';

  if (isHome) {
    html += '<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50">';
    html += '<div class="max-w-6xl mx-auto px-4 py-8">' + pageContent + '</div>';
    html += '<footer class="text-center py-6 text-sm text-gray-400">&copy; 2026 模架工装智能管理系统 V2.6.0</footer>';
    html += '</div>';
  } else {
    html += '<div class="flex h-screen overflow-hidden">';
    html += '<aside class="w-60 bg-sidebar-bg flex-shrink-0 flex flex-col">' + renderMenu() + '</aside>';
    html += '<div class="flex-1 flex flex-col overflow-hidden">';
    html += renderTopBar();
    html += '<main class="flex-1 overflow-y-auto p-6 bg-gray-50">' + pageContent + '</main>';
    html += '</div></div>';
  }

  document.getElementById('app').innerHTML = html;
};
